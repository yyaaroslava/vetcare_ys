version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: vetcare_db
      POSTGRES_USER: vetcare_user
      POSTGRES_PASSWORD: vetcare_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vetcare_network

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "sleep 5 && python manage.py migrate && python manage.py setup_demo_data && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=vetcare_db
      - DB_USER=vetcare_user
      - DB_PASSWORD=vetcare_password
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    networks:
      - vetcare_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - vetcare_network

volumes:
  postgres_data:

networks:
  vetcare_network:
    driver: bridge
